<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Animated terminal card</title>
  <desc id="termDesc">A terminal window revealing whoami, focus and currently learning lines with a blinking cursor.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0714"/>
      <stop offset="55%" stop-color="#100A22"/>
      <stop offset="100%" stop-color="#160D2E"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#160D2E"/>
      <stop offset="100%" stop-color="#1E1240"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bodyClip">
      <rect x="1" y="38" width="638" height="301"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="638" height="338" rx="18" fill="url(#shell)" stroke="url(#edge)" stroke-width="1.4"/>
  <path d="M 0 18 A 18 18 0 0 1 18 0 H 622 A 18 18 0 0 1 640 18 V 38 H 0 Z" fill="url(#topbar)"/>
  <line x1="0" y1="38.5" x2="640" y2="38.5" stroke="#3B1E6E" stroke-opacity=".7"/>

  <g>
    <circle cx="24" cy="19" r="5" fill="#F472B6" opacity=".85"/>
    <circle cx="44" cy="19" r="5" fill="#FBBF24" opacity=".85"/>
    <circle cx="64" cy="19" r="5" fill="#34D399" opacity=".85"/>
    <text x="320" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#7C6BA8">himakshi@igdtuw — zsh</text>
  </g>

  <g clip-path="url(#bodyClip)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <g>
        <text x="28" y="78" fill="#A78BFA">$</text>
        <text x="46" y="78" fill="#F5F3FF">whoami</text>
      </g>
      <g>
        <text x="28" y="106" fill="#F472B6">→</text>
        <text x="50" y="106" fill="#C4B5FD">himakshi khangar</text>
      </g>
      <g>
        <text x="28" y="148" fill="#A78BFA">$</text>
        <text x="46" y="148" fill="#F5F3FF">cat focus.txt</text>
      </g>
      <g>
        <text x="28" y="176" fill="#F472B6">→</text>
        <text x="50" y="176" fill="#E9D5FF">Learn. Build. Experiment. Repeat.</text>
      </g>
      <g>
        <text x="28" y="218" fill="#A78BFA">$</text>
        <text x="46" y="218" fill="#F5F3FF">echo $CURRENTLY</text>
      </g>
      <g>
        <text x="28" y="246" fill="#F472B6">→</text>
        <text x="50" y="246" fill="#E9D5FF">Java · Python · Web · Robotics &amp; AI</text>
      </g>
      <g>
        <text x="28" y="288" fill="#A78BFA">$</text>
        <rect x="46" y="274" width="9" height="17" rx="1" fill="#C4B5FD">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="0" y="0" width="640" height="2" fill="url(#scan)" opacity=".8">
      <animate attributeName="y" values="38;338" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity=".65">
    <circle cx="608" cy="322" r="2" fill="#34D399">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="598" y="326" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4" fill="#7C6BA8">CONNECTED</text>
  </g>
</svg>
