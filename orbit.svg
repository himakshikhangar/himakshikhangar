<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="orbitTitle orbitDesc">
  <title id="orbitTitle">Animated AI orbital graphic</title>
  <desc id="orbitDesc">Three tilted orbits around a glowing AI core with travelling nodes and the labels robotics, automation and future tech.</desc>

  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".1"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="o1" d="M 40,200 a 160,62 0 1,0 320,0 a 160,62 0 1,0 -320,0" fill="none"/>
    <path id="o2" d="M 80,200 a 120,46 0 1,0 240,0 a 120,46 0 1,0 -240,0" fill="none"/>
    <path id="o3" d="M 120,200 a 80,30 0 1,0 160,0 a 80,30 0 1,0 -160,0" fill="none"/>
  </defs>

  <circle cx="200" cy="200" r="185" fill="none" stroke="#7C3AED" stroke-width=".8" stroke-dasharray="2 10" opacity=".3">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#A78BFA" stroke-width=".6" stroke-dasharray="1 14" opacity=".18">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="36s" repeatCount="indefinite"/>
  </circle>

  <g transform="rotate(-18 200 200)">
    <path d="M 40,200 a 160,62 0 1,0 320,0 a 160,62 0 1,0 -320,0" fill="none" stroke="url(#ring)" stroke-width="1.2" stroke-dasharray="5 9" opacity=".55"/>
    <circle r="4" fill="#C4B5FD" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite">
        <mpath href="#o1"/>
      </animateMotion>
    </circle>
    <circle r="2.4" fill="#F472B6" filter="url(#glow)">
      <animateMotion dur="14s" begin="-7s" repeatCount="indefinite">
        <mpath href="#o1"/>
      </animateMotion>
    </circle>
  </g>

  <g transform="rotate(24 200 200)">
    <path d="M 80,200 a 120,46 0 1,0 240,0 a 120,46 0 1,0 -240,0" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="4 8" opacity=".45"/>
    <circle r="3" fill="#A78BFA" filter="url(#glow)">
      <animateMotion dur="20s" repeatCount="indefinite">
        <mpath href="#o2"/>
      </animateMotion>
    </circle>
  </g>

  <g transform="rotate(-40 200 200)">
    <path d="M 120,200 a 80,30 0 1,0 160,0 a 80,30 0 1,0 -160,0" fill="none" stroke="url(#ring)" stroke-width=".9" stroke-dasharray="3 7" opacity=".35"/>
    <circle r="2.4" fill="#E9D5FF" filter="url(#glow)">
      <animateMotion dur="26s" repeatCount="indefinite">
        <mpath href="#o3"/>
      </animateMotion>
    </circle>
  </g>

  <circle cx="200" cy="200" r="58" fill="url(#coreGlow)" opacity=".7"/>
  <circle cx="200" cy="200" r="44" fill="none" stroke="#A855F7" stroke-width="1" opacity=".5">
    <animate attributeName="r" values="44;58;44" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0;.5" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="34" fill="url(#coreGrad)" stroke="#C4B5FD" stroke-width="1.2" filter="url(#glow)"/>
  <text x="200" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3" fill="#F5F3FF">AI</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#A78BFA" opacity=".85">
    <circle cx="22" cy="48" r="2.2" fill="#A855F7"/>
    <text x="32" y="51">ROBOTICS</text>
    <circle cx="292" cy="94" r="2.2" fill="#F472B6"/>
    <text x="302" y="97">AUTOMATION</text>
    <circle cx="34" cy="352" r="2.2" fill="#C084FC"/>
    <text x="44" y="355">FUTURE TECH</text>
  </g>

  <g>
    <circle cx="66" cy="122" r="1.4" fill="#C4B5FD">
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="160" r="1.2" fill="#A78BFA">
      <animate attributeName="opacity" values=".2;.9;.2" dur="5.2s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="118" cy="318" r="1.3" fill="#E9D5FF">
      <animate attributeName="opacity" values=".2;1;.2" dur="4.6s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="300" r="1.2" fill="#F472B6">
      <animate attributeName="opacity" values=".2;.85;.2" dur="5.8s" begin="-.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="228" r="1" fill="#C4B5FD">
      <animate attributeName="opacity" values=".2;.9;.2" dur="4.2s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="252" r="1" fill="#A78BFA">
      <animate attributeName="opacity" values=".2;.8;.2" dur="5s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
