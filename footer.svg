<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">Animated footer wave with meteor shower</title>

  <defs>
    <style>
      .star { animation: twinkle var(--d, 4s) ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: .12; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .star { animation: none; opacity: .5; }
      }
    </style>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="32%" stop-color="#7C3AED"/>
      <stop offset="64%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="30%" stop-color="#F5F3FF" stop-opacity=".75"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <circle class="star" cx="90" cy="36" r="1.4" fill="#E9D5FF" style="--d:3.6s; animation-delay:-1.1s"/>
    <circle class="star" cx="220" cy="72" r="1.1" fill="#C4B5FD" style="--d:4.8s; animation-delay:-2.3s"/>
    <circle class="star" cx="340" cy="30" r="1.7" fill="#F5F3FF" style="--d:3.2s; animation-delay:-.7s"/>
    <circle class="star" cx="470" cy="86" r="1.2" fill="#A78BFA" style="--d:5.1s; animation-delay:-3.2s"/>
    <circle class="star" cx="590" cy="42" r="1.5" fill="#E9D5FF" style="--d:3.9s; animation-delay:-1.8s"/>
    <circle class="star" cx="710" cy="76" r="1.1" fill="#C4B5FD" style="--d:4.4s; animation-delay:-.5s"/>
    <circle class="star" cx="840" cy="34" r="1.8" fill="#F5F3FF" style="--d:3.4s; animation-delay:-2.7s"/>
    <circle class="star" cx="960" cy="88" r="1.2" fill="#A78BFA" style="--d:5.3s; animation-delay:-1.4s"/>
    <circle class="star" cx="1080" cy="48" r="1.5" fill="#E9D5FF" style="--d:3.7s; animation-delay:-3.6s"/>
    <circle class="star" cx="1150" cy="110" r="1.1" fill="#C4B5FD" style="--d:4.6s; animation-delay:-2s"/>
    <circle class="star" cx="150" cy="120" r="1" fill="#A78BFA" style="--d:4.9s; animation-delay:-.9s"/>
    <circle class="star" cx="530" cy="124" r="1.2" fill="#C4B5FD" style="--d:4.1s; animation-delay:-2.5s"/>
    <circle class="star" cx="900" cy="128" r="1" fill="#A78BFA" style="--d:5s; animation-delay:-1.6s"/>
  </g>

  <ellipse cx="600" cy="210" rx="520" ry="120" fill="url(#bottomGlow)"/>

  <path d="M 0,170 C 220,110 400,210 620,160 C 840,110 1000,210 1200,155 L 1200,240 L 0,240 Z" fill="url(#backGrad)" opacity=".8">
    <animate attributeName="d"
      values="M 0,170 C 220,110 400,210 620,160 C 840,110 1000,210 1200,155 L 1200,240 L 0,240 Z;M 0,155 C 220,205 400,120 620,165 C 840,205 1000,125 1200,170 L 1200,240 L 0,240 Z;M 0,170 C 220,110 400,210 620,160 C 840,110 1000,210 1200,155 L 1200,240 L 0,240 Z"
      dur="18s" repeatCount="indefinite"/>
  </path>

  <path d="M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120 L 1200,240 L 0,240 Z" fill="url(#waveGrad)">
    <animate attributeName="d"
      values="M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120 L 1200,240 L 0,240 Z;M 0,125 C 180,185 340,85 520,135 C 700,185 860,90 1040,135 C 1110,155 1160,140 1200,150 L 1200,240 L 0,240 Z;M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120 L 1200,240 L 0,240 Z"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <path d="M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120" fill="none" stroke="url(#crest)" stroke-width="1.6" opacity=".7">
    <animate attributeName="d"
      values="M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120;M 0,125 C 180,185 340,85 520,135 C 700,185 860,90 1040,135 C 1110,155 1160,140 1200,150;M 0,140 C 180,80 340,190 520,140 C 700,90 860,190 1040,140 C 1110,120 1160,130 1200,120"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(980,-40)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.04;.28;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-520 380;-520 380" keyTimes="0;.28;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      <path d="M 0,0 L 64,64" stroke="url(#meteorGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.4" fill="#F5F3FF" filter="url(#glow)"/>
    </g>
  </g>

  <g transform="translate(1100,10)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.05;.3;1" dur="11s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 420;-600 420" keyTimes="0;.3;1" dur="11s" begin="3s" repeatCount="indefinite"/>
      <path d="M 0,0 L 72,72" stroke="url(#meteorGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#F5F3FF" filter="url(#glow)"/>
    </g>
  </g>

  <g transform="translate(760,-70)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.04;.26;1" dur="8.5s" begin="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-420 360;-420 360" keyTimes="0;.26;1" dur="8.5s" begin="6s" repeatCount="indefinite"/>
      <path d="M 0,0 L 56,56" stroke="url(#meteorGrad)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#F5F3FF" filter="url(#glow)"/>
    </g>
  </g>
</svg>
