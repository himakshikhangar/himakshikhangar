<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-labelledby="dividerTitle">
  <title id="dividerTitle">Animated neural divider</title>

  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7C3AED" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".85"/>
      <stop offset="82%" stop-color="#F472B6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#C4B5FD" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="80" y="39.25" width="1040" height="1.5" fill="url(#lineGrad)" opacity=".6"/>
  <rect x="80" y="38" width="1040" height="4" fill="url(#lineGrad)" opacity=".14" filter="url(#glow)"/>

  <g opacity=".8">
    <circle cx="80" cy="40" r="2" fill="#A78BFA"/>
    <circle cx="1120" cy="40" r="2" fill="#F472B6"/>
  </g>

  <g transform="rotate(45 600 40)">
    <rect x="593" y="33" width="14" height="14" rx="2" fill="#0B0714" stroke="#A855F7" stroke-width="1.4"/>
    <rect x="597" y="37" width="6" height="6" rx="1" fill="#C4B5FD">
      <animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#glow)">
    <circle cy="40" r="3" fill="#F5F3FF">
      <animate attributeName="cx" values="80;1120" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="40" r="2" fill="#F472B6">
      <animate attributeName="cx" values="1120;80" dur="11s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.08;.9;1" dur="11s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <circle cx="240" cy="24" r="1.6" fill="#C4B5FD">
      <animate attributeName="cy" values="24;18;24" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="54" r="1.3" fill="#A78BFA">
      <animate attributeName="cy" values="54;60;54" dur="6.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.8;.2" dur="6.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="26" r="1.4" fill="#F472B6">
      <animate attributeName="cy" values="26;20;26" dur="5.8s" begin=".5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="5.8s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="52" r="1.2" fill="#C4B5FD">
      <animate attributeName="cy" values="52;58;52" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.8;.2" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
